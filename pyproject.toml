[project]
name = "prd-inator"
version = "0.1.0"
description = "An autonomous LangGraph pipeline that generates AI-resistant technical take home assignments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-openai>=1.1.12",
    "langgraph>=1.1.6",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "langchain-google-genai>=4.2.1",
    "langchain>=1.2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prd_inator"]
