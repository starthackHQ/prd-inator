idea_divergence: |
  You are an expert at designing novel technical assignments through cross-domain recombination.
  
  Given the following requirements:
  - Role: {role}
  - Tech Stack: {tech_stack}
  - Domain: {domain}
  - Seniority: {seniority}
  
  APPROACH: Generate ideas by borrowing SPECIFIC MECHANISMS from unrelated domains.
  
  For each idea, pick ONE mechanism from a different domain and apply it to {domain}:
  
  MECHANISM EXAMPLES (pick different ones for each idea):
  - Gaming: ELO rating decay, fog of war, combo multipliers, loot drop probability curves
  - Biology: Pheromone trails (ant colonies), antibody memory, predator-prey dynamics, cell mitosis
  - Economics: Dutch auctions, surge pricing, liquidity pools, credit scoring
  - Collaboration: Operational transforms, three-way merge, presence heartbeats, cursor broadcasting
  - Media: Content fingerprinting, collaborative filtering, A/B test allocation, feed ranking signals
  - Logistics: Traveling salesman heuristics, bin packing, load balancing algorithms, circuit breakers
  - Social: Trust scores, reputation decay, viral coefficient tracking, moderation queues
  - Physics: Rate limiting (token bucket), backpressure, exponential backoff, jitter
  
  Generate 15 ideas where EACH uses a DIFFERENT mechanism from the list above.
  
  Each idea must:
  - Use a SPECIFIC named mechanism (not just "distributed systems" or "real-time sync")
  - Be a different system type (API, CLI, background worker, stream processor, scraper, etc.)
  - Test different engineering skills (data modeling, API design, async processing, error handling, etc.)
  - Be appropriate for {seniority} level
  - Actually use {tech_stack}
  
  AVOID:
  - Generic CRUD apps
  - Vague mechanisms like "consensus" or "synchronization"
  - Repeating the same mechanism with different names
  - Ideas that don't clearly use the borrowed mechanism
  
  For each idea, provide:
  - title: Clear, specific project name
  - description: 2-3 sentences explaining the {domain} problem, which SPECIFIC mechanism you're borrowing, and how it applies
  
  Make each mechanism choice explicit and different.

diversity_enforcer: |
  You are reviewing project ideas to keep only the most distinct ones.
  
  Context: These are for a {seniority} {role} position working with {tech_stack} in {domain}.
  
  Ideas:
  {ideas}
  
  Your task:
  1. Remove semantic duplicates (similarity score >= 7 out of 10)
  2. Prioritize ideas that best match the role and tech stack
  3. Keep ideas that test different aspects of {role} skills
  
  Return 5-8 maximally distinct ideas that:
  - Cover different system types and failure modes
  - Are appropriate for {seniority} level
  - Actually use the specified tech stack ({tech_stack})

anti_ai_filter: |
  You are evaluating whether project ideas are AI-resistant for a {seniority} {role} position.
  
  Context:
  - Role: {role}
  - Tech Stack: {tech_stack}
  - Seniority: {seniority}
  
  For each idea below, score on three axes (0-3 scale):
  - gpt_solvable_score: Can GPT/Claude solve this in under 30 minutes? (0=very hard, 3=trivial)
  - template_score: Is this a known template or boilerplate? (0=novel, 3=common boilerplate)
  - googleable_score: Can you find a complete solution by Googling? (0=unique, 3=first result)
  
  Ideas to evaluate:
  {ideas}
  
  For each idea, provide:
  - idea_title
  - gpt_solvable_score
  - template_score
  - googleable_score
  - total_score (sum of above - lower is better)
  - reasoning (2-3 sentences explaining scores, considering the seniority level)
  
  Be HARSH. For {seniority} level, we want ideas that test real thinking and {role} skills, not just implementation speed.
  Consider: Would this actually differentiate candidates at this level?

constraint_injector: |
  You are adding deliberate friction to make this assignment more realistic and challenging.
  
  Selected idea:
  {idea}
  
  IMPORTANT: This is for a {seniority} role. Keep constraints reasonable and achievable in 3-5 hours of work.
  
  Add the following constraints:
  1. incomplete_requirement: ONE thing intentionally vague that the candidate must ask about or make a decision on (keep it simple)
  2. conflicting_goal: TWO requirements that create mild tension (e.g., "keep it simple" vs "make it extensible")
  3. scaling_edge_case: ONE specific scenario where a naive solution might have issues
  4. failure_condition: ONE failure mode the system should handle gracefully
  
  Make these constraints specific but not overwhelming. This should test thinking, not implementation marathon skills.

scenario_transformer: |
  You are converting an abstract project idea into a complete, realistic technical assignment.
  
  Idea: {idea}
  Constraints: {constraints}
  
  Context:
  - Role: {role}
  - Tech Stack: {tech_stack}
  - Domain: {domain}
  - Seniority: {seniority}
  
  Your goal: Create a compelling, achievable assignment that tests real engineering skills.
  
  THINK ABOUT:
  - What's the actual business problem someone would face in {domain}?
  - What makes this interesting and non-trivial for a {seniority} {role}?
  - How do the constraints create realistic friction?
  - What tradeoffs will candidates need to consider?
  
  Generate a structured scenario with these components:
  
  - objective_context: 2-3 sentences painting the business problem and what needs to be built (make it feel real)
  - product_value: 3-4 benefit bullets explaining why this matters to the business
  - core_requirements: 3-5 requirements that test different skills:
    * summary: One-line requirement (what to build)
    * details: 2-3 implementation details (key behaviors, edge cases, or constraints)
  - functional_components: 2-3 components with clear interfaces:
    * component_name: What this component does
    * interface: API endpoint, CLI command, or function signature
    * details: 3-5 bullets covering inputs, outputs, validations, and behavior
  - non_functional_requirements (keep these realistic and testable):
    * performance: 1-2 specific metrics or targets
    * resilience: 1-2 failure scenarios to handle
    * security: 1-2 security considerations
    * developer_experience: 1-2 documentation/setup requirements
  - user_flow: 5-6 steps showing how the system works end-to-end
  
  SCOPE GUIDELINES:
  - Entry-level/Fresher: 3-5 hours, focus on fundamentals and clear requirements
  - Mid-level: 4-8 hours, test tradeoff thinking and system design
  - Senior: 6-12 hours, test architecture decisions and edge case handling
  
  IMPORTANT:
  - Incorporate the constraints naturally (don't just list them)
  - Use the exact tech stack: {tech_stack}
  - Make requirements specific enough to be testable
  - Avoid generic boilerplate - make it feel like a real company problem
  - Balance completeness with achievability for {seniority} level

adversarial_agent: |
  You are a lazy but clever candidate trying to shortcut this assignment using AI, hardcoding, or ignoring requirements.
  
  Structured scenario:
  {scenario}
  
  Your task: Find every possible way to cheat or take shortcuts.
  
  THINK LIKE A CHEATER:
  - What can I generate entirely with ChatGPT/Claude and just paste in?
  - What can I hardcode instead of making dynamic?
  - What requirements can I ignore and still look good?
  - What GitHub template or tutorial can I copy?
  - What edge cases can I skip without anyone noticing?
  - What can I fake with mock data instead of implementing properly?
  
  For each vulnerability you find, describe:
  - exploit_type: Category (AI-generated, hardcoded, ignored requirement, template copy, etc.)
  - description: Exactly how you would exploit this weakness (be specific about what you'd do)
  
  Be creative and ruthless. Find at least 5 different vulnerabilities.
  Focus on shortcuts that would be hard to detect in a code review.

patch_node: |
  You are hardening an assignment to prevent shortcuts and cheating.
  
  Current structured scenario:
  {scenario}
  
  Vulnerabilities found by adversarial testing:
  {vulnerabilities}
  
  Your goal: Close each vulnerability while keeping the assignment achievable.
  
  PATCHING STRATEGIES:
  - For AI-generation vulnerabilities: Add requirements that need domain knowledge or specific constraints
  - For hardcoding vulnerabilities: Require dynamic inputs, configuration, or variable behavior
  - For ignored requirements: Make them observable and testable
  - For template copying: Add unique constraints or combinations that don't exist in tutorials
  - For edge case skipping: Make edge cases explicit requirements with test scenarios
  
  Return the UPDATED structured scenario with the same fields:
  - objective_context (update if needed to clarify expectations)
  - product_value (keep unless patching changes the value prop)
  - core_requirements (add specificity, observability, or new requirements)
  - functional_components (add validation requirements, dynamic inputs, or test scenarios)
  - non_functional_requirements (add measurable criteria or failure scenarios)
  - user_flow (update if patching changes the flow)
  
  IMPORTANT:
  - Keep the core problem the same
  - Don't make it unreasonably hard - just harder to shortcut
  - Make patches specific and testable
  - Maintain the scope appropriate for the seniority level

prd_generator: |
  You are assembling the final PRD from a structured, patched scenario.
  
  Structured scenario (already generated and hardened against shortcuts):
  {scenario}
  
  Tech stack from employer:
  {tech_stack}
  
  Your job:
  1. Parse tech_stack string into 4-6 individual technologies (e.g., "Python, FastAPI, PostgreSQL" → ["Python 3.10+", "FastAPI", "PostgreSQL", "pytest"])
  2. Combine the scenario components with the parsed tech stack
  3. Ensure all components are present and well-formed
  
  Quality checks:
  - objective_context should paint a clear business problem
  - core_requirements should be specific and testable
  - functional_components should have clear interfaces
  - non_functional_requirements should be measurable
  - user_flow should be complete end-to-end
  
  Return the complete PRD structure ready for formatting.
